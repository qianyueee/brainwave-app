name: Build Android App (APK)

# Android アプリ（Capacitor）の APK。Web バンドル（pnpm build:android → android-web/ →
# cap sync）→ Gradle の2段。手順と署名鍵の用意は android/README.md。
#
# - Android まわりを変えた push：debug ビルドで「通るか」だけ確かめる（配布しない。
#   debug の署名は毎回違うので、入れ直すとアプリ内の記録が消える）
# - `android-v*` タグ（例 android-v1.0.0）：配布用の release APK を正式な鍵で署名し、
#   Release に添付する
# - Actions タブから手動実行（release を作るかを選べる）

on:
  workflow_dispatch:
    inputs:
      release:
        description: "正式な鍵で署名した release APK を作る（Secrets が必要）"
        type: boolean
        default: false
  push:
    tags:
      - "android-v*"
    branches:
      - "**"
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/build-android.mjs"
      - "scripts/check-thinkgear.mjs"
      - "lib/native/**"
      - "lib/mind/thinkgear*.ts"
      - "bridge/thinkgear.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Capacitor 8 の CLI は Node 22 以上。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Capacitor 8 の Android は JDK 21。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 既定の packages（"tools platform-tools"）の "tools" は SDK から消えていて失敗する。
      # ランナーには SDK が入っているので、ライセンスの受諾と platform-tools だけ。
      # compileSdk 36 のプラットフォーム等は Gradle（AGP）が必要なら取りに行く。
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false

      # ThinkGear の突き合わせ（bridge/thinkgear.py を動かす）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PC ブリッジ（Python）とアプリ（TS）のパーサが同じ測定を作るか。
      - name: ThinkGear parser parity
        run: pnpm check:thinkgear

      # Supabase の env は Web 版（deploy.yml）と同じリポジトリ変数：ログインと
      # アカウント同期が使う。無いと build-android.mjs が失敗する。
      - name: Build web bundle and sync into android/
        run: pnpm build:android
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Decide build type and version
        id: meta
        env:
          WANT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* || "$WANT_RELEASE" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # 上書き更新は「同じ鍵」でしか通らない。鍵は Secrets にだけ置く（android/README.md）。
      - name: Decode signing key
        if: steps.meta.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secrets の ANDROID_KEYSTORE_BASE64 がありません（android/README.md の「署名鍵」）"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # versionCode は run 番号（増える一方）。versionName はタグから。
      - name: Gradle build
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.meta.outputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ "${{ steps.meta.outputs.release }}" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "dist/NeuroSync-${{ steps.meta.outputs.version }}.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/NeuroSync-debug-${{ steps.meta.outputs.version }}.apk"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSync-android-${{ steps.meta.outputs.version }}
          path: dist/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
